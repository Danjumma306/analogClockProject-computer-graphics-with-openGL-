<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b5d3b">
  <meta name="description" content="A live analog clock inspired by Palm University College, with local time and date.">
  <title>Palm University College · Analog Clock</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="clock.js" defer></script>
</head>
<body>
  <header class="page-header">
    <div class="wordmark"><img src="assets/palm-logo.png" alt="Palm University College — Educating Ethical & Excellent Leaders" width="1254" height="1254"></div>
    <span class="project-label">ANALOG CLOCK</span>
  </header>
  <main>
    <h1 class="sr-only">Palm University College analog clock</h1>
    <section class="clock-card" aria-label="Live clock">
      <svg class="clock" viewBox="0 0 600 600" role="img" aria-label="Analog clock showing your local time">
        <defs>
          <filter id="face-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#153e2d" flood-opacity=".10"/></filter>
          <clipPath id="face-clip"><circle cx="300" cy="300" r="243"/></clipPath>
        </defs>
        <circle cx="300" cy="300" r="260" fill="#e8e5d8"/>
        <circle cx="300" cy="300" r="253" fill="#0b5d3b" filter="url(#face-shadow)"/>
        <circle cx="300" cy="300" r="244" fill="#fbfaf4"/>
        <circle cx="300" cy="300" r="237" fill="none" stroke="#c8921a" stroke-opacity=".45"/>
        <g clip-path="url(#face-clip)">
          <image class="face-logo" href="assets/palm-logo.png" x="116" y="49" width="368" height="368" opacity=".15"/>
        </g>
        <g id="ticks" aria-hidden="true"></g>
        <g id="numerals" aria-hidden="true"></g>
        <g id="hour-hand" class="hand"><path d="M293 321 L293 193 Q300 180 307 193 L307 321 Z" fill="#0b5d3b"/></g>
        <g id="minute-hand" class="hand"><path d="M295.5 325 L295.5 135 Q300 124 304.5 135 L304.5 325 Z" fill="#0b5d3b"/></g>
        <g id="second-hand" class="hand"><path d="M298.5 345 L298.5 99 L301.5 99 L301.5 345 Z" fill="#c8921a"/><circle cx="300" cy="335" r="5" fill="#c8921a"/></g>
        <circle cx="300" cy="300" r="12" fill="#c8921a"/>
        <circle cx="300" cy="300" r="5" fill="#fbfaf4"/>
      </svg>
      <div class="readout">
        <p class="time-label"><span class="live-dot" aria-hidden="true"></span><span id="zone">LOCAL TIME</span></p>
        <time id="digital-time" class="digital-time" aria-label="Current local time">--:--:--</time>
        <p id="date" class="date">Loading your local date…</p>
      </div>
      <noscript><p class="notice">Please enable JavaScript to see the live clock.</p></noscript>
    </section>
    <div class="actions">
      <button id="share-button" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M5 13v7h14v-7"/></svg>Share clock</button>
      <button id="fullscreen-button" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span>Full screen</span></button>
    </div>
    <p id="status" class="status" role="status"></p>
  </main>
  <footer>INTEGRITY <span>·</span> LEADERSHIP <span>·</span> EXCELLENCE</footer>
</body>
</html>
